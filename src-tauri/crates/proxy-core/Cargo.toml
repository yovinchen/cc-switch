[package]
name = "cc-switch-proxy-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
publish = false

[lib]
name = "cc_switch_proxy_core"
path = "src/mod.rs"

[dependencies]
bytes = "1.5"
futures = "0.3"
http = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
